[build]
  command = "cd ConvocationWebApp/client && npm install && npm run build && cd ../server && npm install"
  publish = "ConvocationWebApp/client/dist"

[functions]
  directory = "ConvocationWebApp/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["ConvocationWebApp/server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
